server:
  port: ${PORT:8080}

spring:
  application:
    name: boutique-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/boutique}
    username: ${DB_USER:boutique}
    password: ${DB_PASSWORD:boutique}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB

app:
  site-name: ${SITE_NAME:Maison Signature}
  currency: MGA
  free-shipping-threshold: 200000
  shipping-fee: 15000
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000,http://localhost:3001}
  upload-dir: ${UPLOAD_DIR:./uploads}
  security:
    # À remplacer en production (32 caractères minimum)
    jwt-secret: ${JWT_SECRET:change-me-please-this-is-a-dev-only-secret-key}
    token-hours: 12
    admin-email: ${ADMIN_EMAIL:admin@maison-signature.local}
    admin-password: ${ADMIN_PASSWORD:admin1234}
    admin-name: ${ADMIN_NAME:Administrateur}
